<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AVTE Liaison Tracker</title><style>:root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--text-muted:#6b7280;--text-light:#9ca3af;--active:#10b981;--forming:#f59e0b;--pending:#8b5cf6;--monitoring:#6b7280;--header-bg:#1e2a3a;--teal:#0d9488;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}header{background:var(--header-bg);color:#fff;padding:20px 28px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}.hl h1{font-size:18px;font-weight:700;}.hl p{font-size:12px;opacity:.65;margin-top:2px;}.hm{font-size:11px;opacity:.6;text-align:right;}.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}.fb{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text-muted);}.fb.af{background:var(--header-bg);color:#fff;border-color:var(--header-bg);}.fb[data-filter="active"].af{background:var(--active);border-color:var(--active);}.fb[data-filter="forming"].af{background:var(--forming);border-color:var(--forming);}.fb[data-filter="monitoring"].af{background:var(--monitoring);border-color:var(--monitoring);}.fb[data-filter="pending"].af{background:var(--pending);border-color:var(--pending);}.sb{margin-left:auto;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;width:180px;outline:none;}.stats{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 28px;display:flex;gap:24px;flex-wrap:wrap;}.stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}.sd{width:8px;height:8px;border-radius:50%;}.sc{font-weight:700;color:var(--text);}main{padding:24px 28px;max-width:1400px;}.sh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:32px;}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-left:4px solid var(--border);transition:box-shadow .15s;}.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);}.card.s-active{border-left-color:var(--active);}.card.s-forming{border-left-color:var(--forming);}.card.s-pending{border-left-color:var(--pending);}.card.s-monitoring{border-left-color:var(--monitoring);}.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px;}.ct{font-size:15px;font-weight:700;}.csub{font-size:11px;color:var(--text-muted);margin-bottom:8px;}.badge{display:inline-flex;border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap;flex-shrink:0;color:#fff;}.b-active{background:var(--active);}.b-forming{background:var(--forming);}.b-pending{background:var(--pending);}.b-monitoring{background:var(--monitoring);}.cm{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;}.mi{font-size:11px;color:var(--text-muted);}.mi strong{color:var(--text);font-weight:600;}.mr{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;}.mri{font-size:11px;color:var(--text-muted);}.mri strong{display:block;font-size:10px;text-transform:uppercase;color:var(--text-light);margin-bottom:1px;}.etag{display:inline-flex;background:#eff6ff;color:#1d4ed8;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;margin-bottom:8px;}.cf{font-size:12px;font-weight:600;color:var(--teal);margin-bottom:6px;}.cu{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5;}.cn{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:11px;}.cnl{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}footer{padding:16px 28px;border-top:1px solid var(--border);font-size:11px;color:var(--text-light);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}.uh{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 12px;font-size:11px;color:#92400e;}</style></head><body><header><div class="hl"><h1>AVTE External Liaison Tracker</h1><p>Association of Veterinary Technician Educators - Managed by TVD Associates</p></div><div class="hm" id="hm">Loading...</div></header><div class="controls"><button class="fb af" data-filter="all">All</button><button class="fb" data-filter="active">Active</button><button class="fb" data-filter="forming">Forming</button><button class="fb" data-filter="monitoring">Monitoring</button><button class="fb" data-filter="pending">Pending</button><input class="sb" type="text" id="search" placeholder="Search liaisons..."></div><div class="stats" id="stats"></div><main id="main"><div style="text-align:center;padding:60px;color:#9ca3af">Loading...</div></main><footer><div class="uh">Auto-updated from Jotform submissions via Avery</div><div id="fs">avte-liaison-tracker</div></footer><script>const FD=d=>{if(!d)return"--";const[y,m,day]=d.split("-");return["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+" "+parseInt(day)+", "+y;};const BC=s=>({active:"b-active",forming:"b-forming",pending:"b-pending",monitoring:"b-monitoring"}[s]||"b-active");const BL=s=>({active:"Active",forming:"Forming",pending:"Pending",monitoring:"Monitoring"}[s]||s);let DATA=[],AF="all";function rStats(i){const c={active:0,forming:0,pending:0,monitoring:0};i.forEach(x=>{if(c[x.status]!==undefined)c[x.status]++;});const col={active:"#10b981",forming:"#f59e0b",pending:"#8b5cf6",monitoring:"#6b7280"};document.getElementById("stats").innerHTML=Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>"<div class=\"stat\"><div class=\"sd\" style=\"background:"+col[k]+"\"><\/div><span class=\"sc\">"+v+"<\/span> "+k+"<\/div>").join("")+"<div class=\"stat\" style=\"margin-left:auto\"><span class=\"sc\">"+i.length+"<\/span> total<\/div>";}function rCard(l){const meets=(l.lastMeeting||l.nextMeeting)?"<div class=\"mr\">"+(l.lastMeeting?"<div class=\"mri\"><strong>Last meeting<\/strong>"+FD(l.lastMeeting)+"<\/div>":"")+(l.nextMeeting?"<div class=\"mri\"><strong>Next meeting<\/strong>"+FD(l.nextMeeting)+"<\/div>":"")+"<\/div>":"";const eng=l.engagedIn&&!l.engagedIn.includes("N/A")?"<div class=\"etag\">"+l.engagedIn+"<\/div>":"";const rc=(!l.avteRep||l.avteRep==="TBD")?"style=\"color:#f59e0b\"":" ";return"<div class=\"card s-"+l.status+"\"><div class=\"ch\"><div class=\"ct\">"+l.organization+"<\/div><span class=\"badge "+BC(l.status)+"\">"+BL(l.status)+"<\/span><\/div><div class=\"csub\">"+l.fullName+"<\/div>"+eng+"<div class=\"cm\"><div class=\"mi\">Rep: <strong "+rc+">"+(l.avteRep||"TBD")+"<\/strong><\/div><\/div>"+meets+"<div class=\"cf\">"+l.currentFocus+"<\/div><div class=\"cu\">"+l.lastUpdate+"<\/div><div class=\"cn\"><div class=\"cnl\">Board needs<\/div>"+l.boardNeeds+"<\/div><\/div>";}function render(){const q=document.getElementById("search").value.toLowerCase();const items=DATA.filter(l=>{return(AF==="all"||l.status===AF)&&(!q||[l.organization,l.fullName,l.avteRep||"",l.currentFocus||"",...(l.tags||[])].join(" ").toLowerCase().includes(q));});rStats(items);const secs=[{k:"active",lb:"Active Liaisons"},{k:"forming",lb:"Forming"},{k:"monitoring",lb:"Monitoring"},{k:"pending",lb:"Pending"}];let html="";secs.forEach(s=>{const g=items.filter(l=>l.status===s.k);if(!g.length)return;html+="<div class=\"sh\">"+s.lb+" ("+g.length+")<\/div><div class=\"grid\">"+g.map(rCard).join("")+"<\/div>";});if(!html)html="<div style=\"text-align:center;padding:60px;color:#9ca3af\">No results.<\/div>";document.getElementById("main").innerHTML=html;}document.querySelectorAll(".fb").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fb").forEach(x=>x.classList.remove("af"));b.classList.add("af");AF=b.dataset.filter;render();}));document.getElementById("search").addEventListener("input",render);fetch("/liaisons.json?v="+Date.now()).then(r=>r.json()).then(d=>{DATA=d.liaisons;document.getElementById("hm").innerHTML="Updated "+FD(d.meta.lastUpdated)+"<br>TVD Associates";render();}).catch(()=>{document.getElementById("main").innerHTML="<div style=\"text-align:center;padding:60px\">Could not load data.<\/div>";});</script></body></html>
